# Pipeline medalhão: Bronze -> Silver -> Gold.
# Os caminhos vêm de configs/params.yaml (fonte única); cada estágio declara
# apenas o código e os parâmetros que de fato influenciam a sua saída.
vars:
  - configs/params.yaml

stages:
  ingest_bronze:
    cmd: python -m purchase_intention.stages.ingest_bronze
    deps:
      - ${data.raw}
      - src/purchase_intention/layers/base.py
      - src/purchase_intention/layers/bronze.py
      - src/purchase_intention/layers/schema.py
      - src/purchase_intention/layers/storage.py
      - src/purchase_intention/stages/ingest_bronze.py
    params:
      - configs/params.yaml:
          - data.source_url
    outs:
      - ${data.bronze}
      - ${data.bronze_metadata}

  transform_silver:
    cmd: python -m purchase_intention.stages.transform_silver
    deps:
      - ${data.bronze}
      - src/purchase_intention/layers/base.py
      - src/purchase_intention/layers/schema.py
      - src/purchase_intention/layers/silver.py
      - src/purchase_intention/layers/storage.py
      - src/purchase_intention/stages/transform_silver.py
    outs:
      - ${data.silver}
      - ${data.silver_report}

  build_gold:
    cmd: python -m purchase_intention.stages.build_gold
    deps:
      - ${data.silver}
      - src/purchase_intention/layers/base.py
      - src/purchase_intention/layers/gold.py
      - src/purchase_intention/layers/schema.py
      - src/purchase_intention/layers/storage.py
      - src/purchase_intention/stages/build_gold.py
    params:
      - configs/params.yaml:
          - seed
          - split.test_size
    outs:
      - ${data.gold_train}
      - ${data.gold_test}

  train:
    cmd: python -m purchase_intention.stages.train
    deps:
      - ${data.gold_train}
      - src/purchase_intention/modeling/artifacts.py
      - src/purchase_intention/modeling/candidates.py
      - src/purchase_intention/modeling/preprocessing.py
      - src/purchase_intention/modeling/selection.py
      - src/purchase_intention/modeling/training.py
      - src/purchase_intention/stages/train.py
    params:
      - configs/params.yaml:
          - seed
          - train
    outs:
      - ${artifacts.model}
      - ${artifacts.cv_results}

  evaluate:
    cmd: python -m purchase_intention.stages.evaluate
    deps:
      - ${data.gold_test}
      - ${artifacts.model}
      - src/purchase_intention/modeling/evaluation.py
      - src/purchase_intention/modeling/preprocessing.py
      - src/purchase_intention/stages/evaluate.py
    metrics:
      - ${artifacts.metrics}

  # Publica no MLflow. Roda sempre, mas é idempotente: se o modelo (pelo SHA-256)
  # já estiver no MLflow, nada é gravado. Num clone novo, preenche o MLflow local.
  register:
    cmd: python -m purchase_intention.stages.register
    always_changed: true
    deps:
      - ${artifacts.model}
      - ${artifacts.cv_results}
      - ${artifacts.metrics}
      - ${data.bronze_metadata}
      - ${data.gold_test}
      - src/purchase_intention/tracking/publisher.py
      - src/purchase_intention/tracking/registry.py
      - src/purchase_intention/tracking/runs.py
      - src/purchase_intention/stages/register.py
